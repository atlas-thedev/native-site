# Native website (Next.js on 127.0.0.1:3100), behind Cloudflare.
server {
    listen 80;
    listen [::]:80;
    server_name nativelaunch.xyz www.nativelaunch.xyz;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://nativelaunch.xyz$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nativelaunch.xyz;
    ssl_certificate /etc/letsencrypt/live/nativelaunch.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nativelaunch.xyz/privkey.pem;
    return 301 https://nativelaunch.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nativelaunch.xyz;

    ssl_certificate /etc/letsencrypt/live/nativelaunch.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nativelaunch.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    client_max_body_size 2M;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
