# Native website (Next.js on 127.0.0.1:3100), behind Cloudflare.
# Catch-all: ANY domain pointed at this server shows the website, so a domain added in the
# launcher's Admin → Domains tab works as soon as Cloudflare is active (Cloudflare SSL "Full").
# The backend keeps its own server block for api.playnative.net (more specific name wins).
# Install: sudo cp deploy/nginx-native-site.conf /etc/nginx/sites-available/native-site
#          sudo ln -sf ../sites-available/native-site /etc/nginx/sites-enabled/native-site
#          sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # Any valid certificate works with Cloudflare SSL "Full":
    #   sudo certbot certonly --webroot -w /var/www/certbot -d playnative.net -d www.playnative.net
    ssl_certificate /etc/letsencrypt/live/playnative.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playnative.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    # www.<domain> -> <domain>
    if ($host ~* ^www\.(.+)$) { return 301 https://$1$request_uri; }

    client_max_body_size 2M;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
